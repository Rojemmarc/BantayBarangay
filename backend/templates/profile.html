{% extends 'base.html' %}
{% block title %}My profile · BantayBarangay{% endblock %}
{% block content %}
<form class="c au" method="post" novalidate>
{% csrf_token %}
<h1>My profile</h1>
<label for="full_name">Full name</label>
<input id="full_name" name="full_name" value="{{ v.full_name }}" required minlength="2" maxlength="150" autocomplete="name">
<label for="email">Email</label>
<input id="email" name="email" type="email" value="{{ v.email }}" required autocomplete="email">
<label for="contact_number">Contact number</label>
<input id="contact_number" name="contact_number" value="{{ v.contact_number }}" maxlength="20" autocomplete="tel">
{% include 'partials/errors.html' %}
<button class="b pr" style="width:100%;margin-top:.75rem">Save profile</button>
</form>
{% endblock %}
