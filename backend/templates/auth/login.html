{% extends 'base.html' %}{% block title %}Log in · BantayBarangay{% endblock %}{% block mainclass %}auth-main{% endblock %}
{% block content %}{% include 'partials/brand.html' %}
<form class="c au" method="post" novalidate>{% csrf_token %}<h1>Log in</h1><input type="hidden" name="next" value="{{ next }}">
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required autofocus>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
{% if error %}<div class="er" role="alert">{{ error }}</div>{% endif %}
<button class="b pr" style="width:100%;margin-top:.75rem">Log in</button>
<p><a href="{% url 'forgot' %}">Forgot password?</a> · <a href="{% url 'register' %}">Create an account</a></p></form>{% endblock %}
